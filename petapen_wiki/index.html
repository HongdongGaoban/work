<title>ペタペン攻略wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 昔ながらの攻略wiki（PukiWiki/Gamerch系）。白地・ヘッダー帯・メニューバー・左メニュー・本文。装飾は最小限。 */
:root{
  --bg:#ffffff; --page:#f2f2f2; --ink:#222222; --muted:#666666; --line:#cccccc; --line-dark:#999999;
  --link:#0645ad; --visited:#0b0080; --head:#3b5b8c; --head-ink:#ffffff; --bar:#e8eef7; --th:#eeeeee;
  --h2:#e8eef7; --h2-line:#3b5b8c; --hl:#fff8d6;
  --ss:#cc0000; --s:#e06000; --a:#228b22; --b:#1e5aa8; --c:#777777;
  --note:#fffbe6; --note-line:#e6c84c; --warn:#fff0f0; --warn-line:#e08080;
  --f-body:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:Consolas,"Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #f0a000;outline-offset:1px}

.wrap{max-width:1100px;margin:0 auto;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.site-head{background:var(--head);color:var(--head-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{color:var(--head-ink);font-weight:bold;font-size:20px}
.logo:hover{text-decoration:none}
.logo small{font-size:12px;font-weight:normal;margin-left:8px;opacity:.85}
.head-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.search{width:220px;max-width:100%;padding:3px 6px;border:1px solid var(--line-dark);border-radius:0;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.menu-btn{display:none;background:#fff;color:var(--ink);border:1px solid var(--line-dark);padding:3px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.menubar{background:var(--bar);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px;font-size:13px}
.menubar a{margin-right:4px}
.menubar span{color:var(--muted);margin-right:4px}

.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0}
.side{border-right:1px solid var(--line);padding:10px 10px 20px;padding-left:max(10px,env(safe-area-inset-left,0px));font-size:13px}
.side h4{margin:12px 0 4px;padding:2px 6px;background:var(--th);border:1px solid var(--line);font-size:13px}
.side h4:first-child{margin-top:0}
.side ul{list-style:none;margin:0;padding:0 0 0 4px}
.side li{padding:1px 0}
.side li::before{content:"・";color:var(--muted)}
.side li a.on{font-weight:bold;color:var(--ink)}
.side .sub{padding-left:12px}
.side .sub::before{content:"- "}

main{min-width:0;padding:12px 20px 30px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.updated{font-size:12px;color:var(--muted);margin:0 0 14px;text-align:right}
h1{font-size:22px;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line-dark)}
h2{display:flow-root;font-size:17px;margin:26px 0 10px;padding:4px 8px;background:var(--h2);border-left:6px solid var(--h2-line);border-bottom:1px solid var(--h2-line)}
h3{font-size:15px;margin:18px 0 6px;padding-bottom:2px;border-bottom:1px dotted var(--line-dark)}
h3::before{content:"■";color:var(--h2-line);margin-right:4px}
p{margin:0 0 10px}
ul.list,ol.list{margin:0 0 12px;padding-left:1.8em}
ul.list li,ol.list li{margin:2px 0}
.toc{border:1px solid var(--line);background:#f9f9f9;padding:6px 14px;margin:0 0 16px;display:inline-block;font-size:13px}
.toc b{font-size:13px}
.toc ol{margin:2px 0 0;padding-left:1.6em}

.tbl{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;font-size:13px;min-width:50%}
th,td{border:1px solid var(--line-dark);padding:4px 8px;text-align:left;vertical-align:top}
th{background:var(--th);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.tbl.tier td:first-child,.tbl.tier td[rowspan]{text-align:center;vertical-align:middle;white-space:nowrap}

.tier-badge{font-weight:bold;font-size:14px}
.t-SS{color:var(--ss)}.t-S{color:var(--s)}.t-A{color:var(--a)}.t-B{color:var(--b)}.t-C,.t-none{color:var(--c)}
.tag{font-size:12px;color:var(--muted);margin-right:8px}
.tag::before{content:"["}.tag::after{content:"]"}
.tag.hot{color:var(--ink)}

.note,.warn{border:1px solid var(--note-line);background:var(--note);padding:6px 10px;margin:0 0 14px;font-size:13px}
.warn{border-color:var(--warn-line);background:var(--warn)}

.linklist{columns:2 220px;margin:0 0 14px;padding-left:1.8em}
.linklist li{margin:2px 0;break-inside:avoid}
.linklist span{color:var(--muted);font-size:12px}

.news{list-style:none;margin:0 0 14px;padding:0;font-size:13px}
.news li{padding:2px 0;border-bottom:1px dotted var(--line)}
.news time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:10px}

.infobox{float:right;margin:0 0 12px 16px;font-size:13px;min-width:0;width:260px}
.infobox caption{background:var(--head);color:#fff;font-weight:bold;padding:4px;border:1px solid var(--head)}
.infobox th{width:80px}
.recipe{margin:0 0 12px}
.mat{font-weight:bold;background:var(--hl);border:1px solid var(--line);padding:1px 6px}
.plus{margin:0 4px;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:14px;background:#f6f6f6;border:1px solid var(--line);padding:1px 6px}
.copy{font:inherit;font-size:12px;padding:0 6px;margin-left:6px;cursor:pointer;background:#f6f6f6;border:1px solid var(--line-dark);color:var(--ink)}
.src{font-size:12px;color:var(--muted)}
.qa dt{font-weight:bold;margin-top:12px}
.qa dt::before{content:"Q. ";color:var(--ss)}
.qa dd{margin:2px 0 0 1.6em}
.qa dd::before{content:"A. ";color:var(--b);font-weight:bold}
.results{padding-left:1.6em}
.results li{margin:6px 0}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:10px 16px 20px;border-top:1px solid var(--line);background:var(--bg)}
.clear{clear:both}

@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}
  .side{display:none;border-right:0;border-bottom:1px solid var(--line)}
  .side.open{display:block}
  .infobox{float:none;width:100%;margin:0 0 12px}
  .head-tools{width:100%;margin-left:0}
  .search{flex:1}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
</style>

function tierTable(withRole=true){
  const rows = TIER_ORDER.map(t=>{
    const hs = HEROES.filter(h=>h.tier===t);
    const atk = hs.filter(h=>!h.role.startsWith("サポート")).map(h=>hlink(h.name)).join("、")||"―";
    const sup = hs.filter(h=>h.role.startsWith("サポート")).map(h=>hlink(h.name)).join("、")||"―";
    return [badge(t),atk,sup];
  });
  return tbl(["評価","アタッカー・スタン役","サポート"],rows,"tier");
}

function tierTableBy(getTier, getNote){
  const body = TIER_ORDER.map(t=>{
    const hs = HEROES.filter(h=>getTier(h)===t);
    return hs.map((h,i)=>`<tr>${i===0?`<td rowspan="${hs.length}">${badge(t)}</td>`:""}<td>${hlink(h.name)}</td><td>${h.role}</td><td>${getNote(h)}</td></tr>`).join("");
  }).join("");
  return `<div class="tbl tier"><table><thead><tr><th>評価</th><th>ヒーロー</th><th>役割</th><th>評価理由</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

P.faq = {title:"よくある質問（Q&A）", body:()=>`
<p>各攻略サイトの質問掲示板・コメント欄でよく出る質問と回答をまとめました。</p>
<dl class="qa">
<dt>リセマラはするべき？</dt><dd>必須ではありません。神話は氷晶3000個で交換でき、厳冬の心は1-8で確定入手、ブラストネコはガチャから出ません。<a href="#reroll">リセマラページ</a></dd>
<dt>ギフトコードはどこで入力する？</dt><dd>左上の自分のアイコン →「設定」→「ギフトコード」。<a href="#codes">コード一覧</a></dd>
<dt>招待コードの入力場所がわからない</dt><dd>「バトル」画面の左上にある「招待」（雪だるまアイコン）の中に検索欄があります。アイコンはレベル3になると表示されます。</dd>
<dt>自分の招待コードはどこ？</dt><dd>ランク10になると確認できます。</dd>
<dt>バトロワの特殊ルールを読む前に消えてしまう</dt><dd>バトル中、画面下の「思考」アイコンをタップすると確認できます。</dd>
<dt>ワニキングをLv16にしようとしたら「聖物」が必要と出た</dt><dd>「聖物」は専用武器のことです。専用武器を解放するとLv16以降に上げられます。</dd>
<dt>ランクの上限は？</dt><dd>2025年8月時点で30。スタミナを全部使っても到達まで3〜4週間が目安です。</dd>
<dt>銀貨が足りない（金策は？）</dt><dd>ハンターをLv6以上にしてスキルで回収、所蔵品「金庫」の入手が定番。九死一生任務の達成後にハンターを出して放置するのがおすすめです。</dd>
<dt>倍速にするには？</dt><dd>月パスが必要（序盤は2倍速、進行で3倍速）。2人チームはどちらかが月パスを持っていれば両方で使えます。</dd>
<dt>課金するなら何がお得？</dt><dd>映画鑑賞月パスと特典月パス（2025年8月時点）。動画視聴が不要になり、高速進行に上限がなくなります。</dd>
<dt>共同作戦がクリアできない</dt><dd>共同作戦はサーバーをまたいでマッチングするので強いプレイヤーに手伝ってもらえます。エクストラ以上はLv12以上の剣霊が定番です。</dd>
<dt>熱エネルギーが余る</dt><dd>ノーマルを1日10回以上回しても溜まっていく、という報告が多く、余りやすいようです。</dd>
<dt>聖使者が消えた</dt><dd>仕様です。神格化（25%）に失敗するとユニットが消えます。Lv12で確率+10%。</dd>
<dt>炎の魔竜が孵化しない</dt><dd>卵は10秒ごとに2.5%の確率で孵化します（Lv6で+2.5%）。運次第で、孵化せずに終わることもあります。</dd>
</dl>
<h2>未解決の質問</h2>
<p>掲示板で質問されているものの、まだ回答が見つかっていないものです。</p>
${ul(["修復ルーンの入手方法","炎の魔竜のカラースキンを入手したのに解放できない","神話ヒーローLv15以降に必要な素材の数","イベント交換で神話選択宝箱と不朽ヒーローのカケラ、どちらを優先すべきか"])}
`};

/* ---------- ルーティング ---------- */
const main = document.getElementById("main");
function show(id, jump){
  if(!P[id]) id = "top";
  const pg = P[id];
  const crumb = pg.crumb || (id==="top" ? "トップ" : `<a href="#top">トップ</a> ＞ ${pg.title}`);
  main.innerHTML = `<div class="crumb">${crumb}</div><h1>${pg.title}</h1><div class="updated">最終更新：${UPDATED}</div>${pg.body()}`;
  document.querySelectorAll(".side a").forEach(a=>a.classList.toggle("on",a.dataset.go===id));
  document.getElementById("side").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  if(jump){const el=document.getElementById(jump); if(el){el.scrollIntoView(); return;}}
  window.scrollTo(0,0);
}
function go(id, jump){
  show(id, jump);
  try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch(e){}
}
document.addEventListener("click",e=>{
  const cp = e.target.closest("[data-copy]");
  if(cp){
    const t = cp.dataset.copy;
    navigator.clipboard?.writeText(t).then(()=>{cp.textContent="コピーしました"},()=>{selectCode(cp)}) ?? selectCode(cp);
    return;
  }
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  go(a.getAttribute("href").slice(1), a.dataset.jump);
  document.getElementById("q").value="";
});
function selectCode(btn){const s=btn.previousElementSibling;const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent="選択しました";}
document.getElementById("menuBtn").addEventListener("click",()=>{
  const s=document.getElementById("side"); const open=s.classList.toggle("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded",String(open));
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));

/* ---------- 検索 ---------- */
let INDEX = null;
function buildIndex(){
  const tmp = document.createElement("div");
  INDEX = Object.entries(P).map(([id,pg])=>{tmp.innerHTML = pg.body(); return {id,title:pg.title,text:tmp.textContent.replace(/\s+/g," ")};});
}
document.getElementById("q").addEventListener("input",e=>{
  const q = e.target.value.trim();
  if(!q){ show(location.hash.slice(1)||"top"); return; }
  if(!INDEX) buildIndex();
  const hits = INDEX.filter(p=>p.title.includes(q)||p.text.includes(q))
    .sort((a,b)=>(b.title.includes(q)?1:0)-(a.title.includes(q)?1:0));
  const esc = s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  main.innerHTML = `<div class="crumb"><a href="#top">トップ</a> ＞ 検索</div><h1>「${esc(q)}」の検索結果</h1><div class="updated">${hits.length}件</div>` +
    (hits.length ? `<ul class="results">${hits.map(h=>{const i=h.text.indexOf(q);const snip=i<0?h.text.slice(0,80):h.text.slice(Math.max(0,i-30),i+60);return `<li><a href="#${h.id}"><b>${h.title}</b></a><div class="src">…${esc(snip)}…</div></li>`}).join("")}</ul>` : `<p>見つかりませんでした。別の言葉（ヒーロー名、「コード」「銀貨」など）で試してください。</p>`);
});

renderSide();
show(location.hash.slice(1) || "top");
</script>
