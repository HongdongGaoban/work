server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend
    location ~ ^/(jobs|videos|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
